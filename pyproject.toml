[project]
name = "composition"
version = "0.1.0"
description = "A terminal-based note-taking app with Markdown support, SQLite storage, and Meilisearch search"
readme = "README.md"
authors = [
    { name = "Darrien Rushing", email = "drushing.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=8.2.8",
    "meilisearch>=0.31",
    "pyyaml>=6.0",
]

[project.scripts]
composition = "composition.app:main"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
