# Postgres candidate on Fly: one always-on stateless machine; the database is Neon (DATABASE_URL is a secret).
app = "comp-sync-pg-REPLACED-BY-DEPLOY-SCRIPT"
primary_region = "iad"

[env]
  PORT = "8080"
  LOG = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
