# Local rehearsal of the lean setup: the real image and entrypoint, with an S3 mock standing in for R2.
#   docker compose -f lean/compose.yaml up -d --build      # the API is on :8787
# The mock (adobe/s3mock) is only for rehearsing the replicate/restore flow; real deployments replicate to
# Cloudflare R2, and R2-specific behaviour is NOT exercised here.
name: sync-spike-lean
services:
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: sync-spike
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3data:/s3mockroot
  lean:
    build:
      context: ..
      dockerfile: lean/Dockerfile
    depends_on:
      - s3
    env_file:
      - ../.env.tokens.local
    environment:
      LITESTREAM_BUCKET: sync-spike
      LITESTREAM_ENDPOINT: http://s3:9090
      LITESTREAM_REGION: us-east-1
      LITESTREAM_ACCESS_KEY_ID: spike
      LITESTREAM_SECRET_ACCESS_KEY: spike-secret
    volumes:
      - leandata:/data
    ports:
      - "8787:8080"
volumes:
  leandata:
  s3data:
