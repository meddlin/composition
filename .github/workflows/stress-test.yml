name: Stress test

# The generated 1,000- and 10,000-note databases (apps/web/scripts/sample-db, docs/manual-tests/stress-databases.md) run
# through the built web app in headless Chromium. It does what `pnpm manual:stress` does on your machine, because it runs
# that script: a run here is a run there.
#
# When: every Monday (the cron below); the "Run workflow" button, where you pick the sizes; and a pull request that changes
# this file or the stress-test scripts, which runs the two-minute --quick smoke test. No other pull request runs it.
#
# It goes red only when something hard failed: a step timed out, a tab crashed, a run stopped early. How slow things are is
# written to the job summary and kept as an artifact, never failed on, because absolute times move with the runner
# (docs/stress-test-findings.md has the numbers to compare with and what they mean).
#
# A scheduled workflow runs from the default branch only, so the cron starts once this file is on main, and GitHub pauses
# scheduled workflows after 60 days without activity in the repository.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      sizes:
        description: "Databases, comma separated: 1k, 10k, 50k or a number of notes (50k needs far more memory than a standard runner has)"
        type: string
        default: "1k,10k"
      sections:
        description: "What to measure: load,sidebar,open,typing,autosave,pages,linkpicker (empty: all of them)"
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/stress-test.yml"
      - "apps/web/scripts/sample-db/**"

permissions:
  contents: read

concurrency:
  group: stress-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      # Playwright is not a dependency of apps/web. The script installs the version pinned in
      # apps/web/scripts/sample-db/measure/PLAYWRIGHT_VERSION, with the system libraries Chromium needs.
      - name: Run the stress test
        env:
          EVENT: ${{ github.event_name }}
          SIZES: ${{ inputs.sizes }}
          SECTIONS: ${{ inputs.sections }}
          RESULTS_DIR: ${{ runner.temp }}/stress-results
          PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          args=(--install-playwright --results "$RESULTS_DIR")
          if [ "$EVENT" = "pull_request" ]; then
            # Enough to show the workflow and the scripts still work.
            args+=(--quick)
          else
            [ -z "$SIZES" ] || args+=(--sizes "$SIZES")
            [ -z "$SECTIONS" ] || args+=(--sections "$SECTIONS")
          fi
          bash apps/web/scripts/sample-db/stress-test.sh "${args[@]}"

      - name: Add the results to the job summary
        if: always()
        env:
          RESULTS_DIR: ${{ runner.temp }}/stress-results
        run: |
          if [ -f "$RESULTS_DIR/summary.md" ]; then
            cat "$RESULTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The stress test wrote no summary: see the log of the previous step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: ${{ runner.temp }}/stress-results
          if-no-files-found: ignore
          retention-days: 90
