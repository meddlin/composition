name: Stress test (line counts)

# One note each of 500, 5,000 and 10,000 lines (apps/web/scripts/sample-db, docs/manual-tests/stress-databases.md), opened and
# typed in on every editor tab of the built web app, in headless Chromium. It does what `pnpm manual:stress:lines` does on
# your machine, because it runs that script: a run here is a run there.
#
# When: only when you press "Run workflow" (you choose the line counts, and whether the notes hold headings, lists and code or
# plain paragraphs), and on a pull request that changes this file or the stress-test scripts, where it runs the 500-line note
# alone as a smoke test. It never runs on a schedule; the weekly run is stress-test.yml.
#
# It goes red only when something hard failed: a step timed out, a tab crashed, a run stopped early. How slow things are is
# written to the job summary and kept as an artifact, never failed on, because absolute times move with the runner.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Line counts, comma separated (each a note of that many lines)"
        type: string
        default: "500,5000,10000"
      profile:
        description: "What the notes hold: mixed (headings, lists, code, tables) or plain (wrapped paragraphs only)"
        type: choice
        options:
          - mixed
          - plain
        default: mixed
  pull_request:
    paths:
      - ".github/workflows/stress-test-lines.yml"
      - "apps/web/scripts/sample-db/**"

permissions:
  contents: read

concurrency:
  group: stress-test-lines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-test-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      # Playwright is not a dependency of apps/web. The script installs the version pinned in
      # apps/web/scripts/sample-db/measure/PLAYWRIGHT_VERSION, with the system libraries Chromium needs.
      - name: Run the line-count stress test
        env:
          EVENT: ${{ github.event_name }}
          LINES: ${{ inputs.lines }}
          PROFILE: ${{ inputs.profile }}
          RESULTS_DIR: ${{ runner.temp }}/stress-results
          PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          args=(--install-playwright --results "$RESULTS_DIR")
          if [ "$EVENT" = "pull_request" ]; then
            # Enough to show the workflow and the scripts still work.
            args+=(--lines 500)
          else
            args+=(--lines "${LINES:-500,5000,10000}" --line-profile "${PROFILE:-mixed}")
          fi
          bash apps/web/scripts/sample-db/stress-test.sh "${args[@]}"

      - name: Add the results to the job summary
        if: always()
        env:
          RESULTS_DIR: ${{ runner.temp }}/stress-results
        run: |
          if [ -f "$RESULTS_DIR/summary.md" ]; then
            cat "$RESULTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The stress test wrote no summary: see the log of the previous step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-lines-results
          path: ${{ runner.temp }}/stress-results
          if-no-files-found: ignore
          retention-days: 90
