name: Build CLI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/cli/uv.lock

      - name: Install CLI dependencies
        run: uv sync --frozen --project apps/cli

      # Builds the sdist and wheel with the uv_build backend from pyproject.toml.
      - name: Build CLI package
        run: uv build apps/cli

  # The TypeScript CLI. The Python job above goes away when the port is finished.
  build-cli-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/cli/pnpm-lock.yaml

      # The bundle includes apps/web's data layer, so its dependencies must be installed first.
      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install CLI dependencies
        run: pnpm --dir apps/cli install --frozen-lockfile

      - name: Build CLI bundle
        run: pnpm --dir apps/cli build

      - name: Check the launcher starts
        run: node apps/cli/bin/composition.mjs --version
