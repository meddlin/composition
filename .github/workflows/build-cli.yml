name: Build CLI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/cli/uv.lock

      - name: Install CLI dependencies
        run: uv sync --frozen --project apps/cli

      # Builds the sdist and wheel with the uv_build backend from pyproject.toml.
      - name: Build CLI package
        run: uv build apps/cli
