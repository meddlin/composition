name: Release desktop

# Runs only when someone pushes a desktop-v* tag by hand, never on a branch, pull
# request or schedule. A release is:
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# It builds both macOS architectures (each with the `composition` command line tool and its own
# Node inside the app), signs and notarizes them, and attaches them, with the
# update feed (latest-mac.yml), to a DRAFT GitHub Release for you to check and publish.
# Publishing it as a normal (non-pre-release) release is what makes installed apps offer it
# as an update. Local equivalent: `pnpm release` in
# apps/desktop. Setup and secrets: docs/deployment/manual-build-release.md.
#
# Once the macOS builds are attached, a second job builds the Linux x64 packages (.deb and AppImage,
# unsigned) on Ubuntu and adds them, with latest-linux.yml, to the same draft.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

# Never cancel a release halfway through notarization.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap checks on a Linux runner, so a mistyped tag fails before the macOS job starts.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must match the desktop version and be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::Tag $TAG doesn't match apps/desktop/package.json version $version (expected desktop-v$version). Delete the tag, fix the version on main, and tag again."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main. Merge it first, then tag."
            exit 1
          fi

  release:
    needs: verify-tag
    # macos-latest is Apple Silicon. The Intel build is cross-built here, so one job (and
    # one notarization wait) covers both architectures.
    runs-on: macos-latest
    timeout-minutes: 60
    # Holds the signing secrets. Add required reviewers to this environment in the repo
    # settings if you want an approval click before each release.
    environment: release
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
            apps/cli/pnpm-lock.yaml

      # notarytool reads the key from a file, so the secret (the .p8 contents) is written to one.
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Installs (web, desktop and CLI), fetches Meilisearch and Node 26, assembles the command line
      # tool that ships inside the app, builds, signs, notarizes and verifies; see the script.
      # electron-builder imports CSC_LINK into a temporary keychain for the run.
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs --tag "$TAG"

      - name: Create the draft release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#desktop-v}"
          flags="--draft"
          case "$version" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Composition desktop $version" \
            --notes "macOS desktop build, signed and notarized (checksums in SHA256SUMS.txt), and Linux x64 packages: a .deb and an AppImage (checksums in SHA256SUMS-linux.txt). latest-mac.yml, latest-linux.yml and the .blockmap files are what installed apps update from; leave them attached. Built by the Release desktop workflow." \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS.txt

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Linux x64, built after the macOS job has created the draft release, so the two never race to create it.
  # Nothing is signed, so this needs no secrets and no `release` environment.
  release-linux:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # add files to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
            apps/cli/pnpm-lock.yaml

      - name: Install web, CLI and desktop dependencies
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/cli install --frozen-lockfile
          pnpm --dir apps/desktop install --frozen-lockfile

      - name: Fetch Meilisearch and Node, and assemble the command line tool
        working-directory: apps/desktop
        run: |
          pnpm fetch:meilisearch linux-x64
          pnpm fetch:node linux-x64
          pnpm stage:cli linux-x64

      - name: Build the .deb and the AppImage
        working-directory: apps/desktop
        run: pnpm dist:linux

      - name: Check the packages
        working-directory: apps/desktop
        run: |
          ls -l release
          test -n "$(ls release/*.deb)" && test -n "$(ls release/*.AppImage)" && test -f release/latest-linux.yml
          expected=$(node -p "require('./package.json').version")
          grep -q "^version: $expected\$" release/latest-linux.yml
          dpkg-deb --info release/*.deb
          expected_cli=$(node -p "require('../cli/package.json').version")
          actual_cli=$(release/linux-unpacked/resources/cli/composition --version)
          echo "composition --version: $actual_cli"
          test "$actual_cli" = "$expected_cli"

      - name: Add the Linux packages to the draft release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt
          # The AppImage carries its block map inside it; a separate .blockmap file is attached only if there is one.
          shopt -s nullglob
          files=(*.deb *.AppImage latest-linux.yml SHA256SUMS-linux.txt *.blockmap)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
