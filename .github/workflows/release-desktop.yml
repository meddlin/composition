name: Release desktop

# Runs only when someone pushes a desktop-v* tag by hand, never on a branch, pull
# request or schedule. A release is:
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# It builds both macOS architectures, signs and notarizes them, and attaches them to a
# DRAFT GitHub Release for you to check and publish. Local equivalent: `pnpm release` in
# apps/desktop. Setup and secrets: docs/deployment/manual-build-release.md.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

# Never cancel a release halfway through notarization.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap checks on a Linux runner, so a mistyped tag fails before the macOS job starts.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must match the desktop version and be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::Tag $TAG doesn't match apps/desktop/package.json version $version (expected desktop-v$version). Delete the tag, fix the version on main, and tag again."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main. Merge it first, then tag."
            exit 1
          fi

  release:
    needs: verify-tag
    # macos-latest is Apple Silicon. The Intel build is cross-built here, so one job (and
    # one notarization wait) covers both architectures.
    runs-on: macos-latest
    timeout-minutes: 60
    # Holds the signing secrets. Add required reviewers to this environment in the repo
    # settings if you want an approval click before each release.
    environment: release
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      # notarytool reads the key from a file, so the secret (the .p8 contents) is written to one.
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Installs, fetches Meilisearch, builds, signs, notarizes and verifies; see the script.
      # electron-builder imports CSC_LINK into a temporary keychain for the run.
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs --tag "$TAG"

      - name: Create the draft release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#desktop-v}"
          flags="--draft"
          case "$version" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Composition desktop $version" \
            --notes "macOS desktop build, signed and notarized. Checksums are in SHA256SUMS.txt. Built by the Release desktop workflow." \
            release/*.dmg release/*.zip release/SHA256SUMS.txt

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
