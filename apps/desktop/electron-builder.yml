# Packaging for the Composition desktop app (macOS only for now).
#
#   pnpm package              unpacked .app in release/, unsigned (for checking a build)
#   pnpm dist                 signed + notarized DMG/ZIP (needs the credentials below)
#
# Signing and notarization read their credentials from the environment, never
# from this file: CSC_LINK / CSC_KEY_PASSWORD (Developer ID Application
# certificate) and APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER.

# PROVISIONAL: confirm the app identifier before the first public release. It
# is part of the code signature and of where macOS stores app preferences, so
# changing it later orphans existing installs.
appId: com.meddlin.composition
productName: Composition
copyright: Copyright © Composition contributors

directories:
  output: release

files:
  - dist/**
  - package.json
  # Source maps are for development only.
  - "!dist/**/*.map"
  # better-sqlite3 13 ships N-API prebuilds; it never compiles at install, so
  # its sources and the bundled SQLite amalgamation aren't needed at runtime.
  - "!node_modules/better-sqlite3/{deps,src,binding.gyp}"
  # Only the platforms we ship. A foreign-OS binary in the bundle would also
  # fail code signing, which expects every executable to be Mach-O.
  - "!node_modules/better-sqlite3/prebuilds/{linux*,win32*}"

asar: true
# better-sqlite3 is N-API: there is nothing to rebuild for Electron's ABI.
npmRebuild: false

# Meilisearch is spawned as a child process, so it must live outside the ASAR.
# `pnpm fetch:meilisearch` places the pinned, checksum-verified binary for each
# architecture in resources/meilisearch/<os>-<arch>/.
extraResources:
  - from: resources/meilisearch/${os}-${arch}
    to: meilisearch
  # License notices (scripts/collect-licenses.mjs): Electron, Chromium, Meilisearch, JS packages.
  - from: resources/licenses
    to: licenses

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
    - target: zip

dmg:
  title: ${productName} ${version}
