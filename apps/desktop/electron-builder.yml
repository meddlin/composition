# Packaging for the Composition desktop app: macOS (DMG, ZIP) and Linux x64 (deb, AppImage).
#
#   pnpm package              unpacked app in release/, unsigned (for checking a build)
#   pnpm dist                 macOS: signed + notarized DMG/ZIP (needs the credentials below)
#   pnpm dist:linux           Linux, on Linux: .deb and .AppImage (nothing to sign)
#
# macOS signing and notarization read their credentials from the environment, never
# from this file: CSC_LINK / CSC_KEY_PASSWORD (Developer ID Application
# certificate) and APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER.

# Reverse-DNS of rushinglabs.com. It is part of the code signature and of where macOS
# stores app preferences, so don't change it after the first public release: that
# orphans existing installs.
appId: com.rushinglabs.composition
productName: Composition
copyright: Copyright © Composition contributors

directories:
  output: release

files:
  - dist/**
  - package.json
  # Source maps are for development only.
  - "!dist/**/*.map"
  # better-sqlite3 13 ships N-API prebuilds; it never compiles at install, so
  # its sources and the bundled SQLite amalgamation aren't needed at runtime.
  - "!node_modules/better-sqlite3/{deps,src,binding.gyp}"
  # Windows isn't shipped. Each platform below drops the other platforms' prebuilds, so only its own
  # (and, on the Mac, never a foreign-OS binary, which would also fail code signing) is bundled.
  - "!node_modules/better-sqlite3/prebuilds/win32*"

asar: true
# better-sqlite3 is N-API: there is nothing to rebuild for Electron's ABI.
npmRebuild: false

# Meilisearch is spawned as a child process, so it must live outside the ASAR.
# `pnpm fetch:meilisearch` places the pinned, checksum-verified binary for each
# architecture in resources/meilisearch/<os>-<arch>/.
extraResources:
  - from: resources/meilisearch/${os}-${arch}
    to: meilisearch
  # The command line tool (`composition`): a launcher, its own Node 26 (Electron's Node has no
  # node:ffi, which the terminal UI needs) and the CLI bundle with its native modules.
  # `pnpm fetch:node` then `pnpm stage:cli` assemble resources/cli/<os>-<arch>/.
  - from: resources/cli/${os}-${arch}
    to: cli
  # License notices (scripts/collect-licenses.mjs): Electron, Chromium, Meilisearch, JS packages.
  - from: resources/licenses
    to: licenses

mac:
  files:
    - "!node_modules/better-sqlite3/prebuilds/linux*"
  category: public.app-category.productivity
  # electron-builder converts this 1024x1024 PNG to an .icns. It only auto-detects
  # build/icon.png or build/icon.icns, so the file name here has to be explicit.
  icon: build/app-icon-1024.png
  # Name the DMG and ZIP after their architecture. Without this the Intel build gets no
  # suffix (Composition-0.1.0.dmg) next to Composition-0.1.0-arm64.dmg.
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
    - target: zip

dmg:
  title: ${productName} ${version}

# Linux, x64 only for now. Built on Linux (`pnpm dist:linux`): electron-builder can't make a bundle that
# runs on Ubuntu from a Mac. `pnpm fetch:meilisearch linux-x64`, `pnpm fetch:node linux-x64` and
# `pnpm stage:cli linux-x64` come first, as for the Mac build.
linux:
  # A PNG of at least 512x512; electron-builder resizes it for the menu and the launcher.
  icon: build/app-icon-1024.png
  category: Office
  synopsis: Notes workspace
  description: Composition is a notes workspace with a built-in search engine and a terminal app.
  # The Debian "Maintainer" field. A GitHub noreply address, so no personal address is published.
  maintainer: Composition contributors <meddlin@users.noreply.github.com>
  # Not `composition`: that name is the command line tool's.
  executableName: composition-desktop
  # Lets GNOME and KDE match the running window to the launcher entry (its icon and name in the dock).
  syncDesktopName: true
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  files:
    # The glibc build (linux-x64.node) is the one Ubuntu uses; musl, other CPUs and other OSes are dropped.
    - "!node_modules/better-sqlite3/prebuilds/{darwin*,linuxmusl*,linux-arm64*}"
  target:
    - target: deb
      arch: x64
    - target: AppImage
      arch: x64

deb:
  # electron-builder's own list, plus ALSA (Chromium's audio), which it leaves out. Ubuntu 24.04 renamed
  # libasound2 to libasound2t64, and left `libasound2` as a name only: apt satisfies it with
  # liboss4-salsa-asound2, a stub that lacks ALSA's symbols, and the app then dies at startup with
  # "undefined symbol: snd_device_name_get_hint". So the real package comes first, and 22.04, which has no
  # libasound2t64, falls through to libasound2. The package's install script also adds the AppArmor
  # profile Ubuntu 24.04 needs before an unprivileged app may use Chromium's sandbox.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

# Over-the-air updates (docs/desktop-updates-plan.md). electron-builder writes this URL into the
# app as app-update.yml, and writes latest-mac.yml (plus .blockmap files) next to the ZIPs, and
# latest-linux.yml next to the AppImage (only the AppImage updates itself; a .deb is installed by
# hand); upload those with the release. "latest/download" is GitHub's redirect to the newest normal
# (non-draft, non-pre-release) release, so the tag name doesn't matter. Nothing is uploaded by
# electron-builder itself: publishing stays the release workflow's job.
publish:
  provider: generic
  url: https://github.com/meddlin/composition/releases/latest/download
