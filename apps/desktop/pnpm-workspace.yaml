# Only this folder is a project. Without this, pnpm also treats the CLI that scripts/stage-cli.mjs
# assembles (resources/cli/*/app) and the packaged copies in release/ as projects of this workspace.
packages:
  - "."

# pnpm 11 refuses to run dependency build scripts unless they're decided here.
# (Electron 44 has no install script: its binary downloads on first use.)
allowBuilds:
  # better-sqlite3 13 ships N-API prebuilds inside its package; never compile.
  better-sqlite3: false
  # Windows installer helper; this app is macOS-only for now.
  electron-winstaller: false
  # Optional speed-up only; esbuild works without its install script.
  esbuild: false

# GHSA-g3hv-75wg-m249: minimatch >=7 <11.0.1 has a DoS via globparts amplification.
# Pulled in by build/lint tooling only; the v3/v5 copies are outside the affected range.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
