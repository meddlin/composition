# Spike S1/S2: the headless core. Not part of any workspace and not built by CI (see ../README.md).
# `--no-default-features --features system-sqlite` links the system libsqlite3 instead of the bundled copy.
[package]
name = "composition-core-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
system-sqlite = []

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false }
flate2 = "=1.1.11"
tar = "=0.4.46"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "3"
